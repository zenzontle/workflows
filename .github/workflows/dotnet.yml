name: .NET build and test

# Restores with the committed packages.lock.json files, then builds and tests.
on:
  workflow_call:
    inputs:
      dotnet-version:
        description: SDK version for actions/setup-dotnet.
        type: string
        default: 10.0.x
      project:
        description: Solution or project to build, relative to the repository root. Empty uses the one at the root.
        type: string
        default: ''

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ inputs.project }} --locked-mode

      - name: Build
        run: dotnet build ${{ inputs.project }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ inputs.project }} --no-build --configuration Release
